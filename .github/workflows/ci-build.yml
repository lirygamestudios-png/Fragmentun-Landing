name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pasoapugmsazziflaomp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zmp738aV9F5KKpHyAktpAA_IO4MGfK1
      NEXT_PUBLIC_SITE_URL: https://www.fragmentun.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Type check diagnostic
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build

      - name: Smoke test public funnel
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/fragmentun-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/es >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/es >/dev/null
          curl -fsS http://127.0.0.1:3000/en >/dev/null
          curl -fsS http://127.0.0.1:3000/es/test >/dev/null
          curl -fsS http://127.0.0.1:3000/es/mapa >/dev/null
          curl -fsS http://127.0.0.1:3000/es/privacidad >/dev/null
          curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null
          curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/login >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/forgot-password >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/reset-password >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go/amazon)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go/patreon)" = "302"
      - name: Commit lockfile changes
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package-lock after dependency changes"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
