name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pasoapugmsazziflaomp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zmp738aV9F5KKpHyAktpAA_IO4MGfK1
      NEXT_PUBLIC_SITE_URL: https://www.fragmentun.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const vs=j.vulnerabilities||{};
          console.log('npm audit summary:',j.metadata?.vulnerabilities||{});
          for(const [name,v] of Object.entries(vs)){
            console.log(JSON.stringify({
              package:name,
              severity:v.severity,
              range:v.range,
              via:Array.isArray(v.via)?v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,severity:x.severity,range:x.range}):v.via,
              fixAvailable:v.fixAvailable
            }));
          }
          NODE

      - name: Type check diagnostic
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build

      - name: Runtime smoke and backend contract tests
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/fragmentun-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "Next.js server failed to become ready"
            cat /tmp/fragmentun-next.log || true
            exit 1
          fi

          assert_status() {
            local expected="$1"
            local url="$2"
            shift 2
            local actual
            actual="$(curl -sS -o /tmp/contract-body.txt -w '%{http_code}' "$@" "$url")"
            echo "$url -> HTTP $actual (expected $expected)"
            if [ "$actual" != "$expected" ]; then
              echo "Response body:"
              cat /tmp/contract-body.txt || true
              echo
              echo "Server log tail:"
              tail -n 80 /tmp/fragmentun-next.log || true
              exit 1
            fi
          }

          # Public pages and funnel
          curl -fsS http://127.0.0.1:3000/es >/dev/null
          curl -fsS http://127.0.0.1:3000/en >/dev/null
          curl -fsS http://127.0.0.1:3000/es/test >/dev/null
          curl -fsS http://127.0.0.1:3000/es/mapa >/dev/null
          curl -fsS http://127.0.0.1:3000/es/privacidad >/dev/null
          curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null
          curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/login >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/forgot-password >/dev/null
          curl -fsS http://127.0.0.1:3000/admin/reset-password >/dev/null

          assert_status 404 http://127.0.0.1:3000/404-test-route
          assert_status 302 http://127.0.0.1:3000/go/amazon
          assert_status 302 http://127.0.0.1:3000/go/patreon

          # Backend contracts: invalid/unauthorized input only; no real data generated
          assert_status 400 http://127.0.0.1:3000/api/auth/login             -X POST -H 'Content-Type: application/json'             --data '{"email":"bad","password":""}'

          assert_status 200 http://127.0.0.1:3000/api/auth/forgot-password             -X POST -H 'Content-Type: application/json'             --data '{"email":"not-an-email"}'

          assert_status 400 http://127.0.0.1:3000/api/auth/update-password             -X POST -H 'Content-Type: application/json'             --data '{"password":"short"}'

          assert_status 400 http://127.0.0.1:3000/api/analytics             -X POST -H 'Content-Type: application/json'             --data '{"event_name":"not_allowed","path":"/es"}'

          assert_status 403 http://127.0.0.1:3000/api/subscribe             -X POST             -H 'Origin: https://evil.example'             -H 'Content-Type: application/x-www-form-urlencoded'             --data 'email=test%40example.com&consent_marketing=yes'

          assert_status 403 http://127.0.0.1:3000/api/admin/status

      - name: Commit lockfile changes
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package-lock after dependency changes"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
