name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pasoapugmsazziflaomp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zmp738aV9F5KKpHyAktpAA_IO4MGfK1
      NEXT_PUBLIC_SITE_URL: https://www.fragmentun.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Type check diagnostic
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Commit lockfile changes
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package-lock after dependency changes"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
